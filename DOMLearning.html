<!DOCTYPE html>
<html>
<head>
    <title>Foodpanda Counter</title>
    <style>
        button { font-size: 20px; padding: 5px 15px; cursor: pointer; }
        span { font-size: 24px; font-weight: bold; margin: 0 15px; }
    </style>
</head>
<body>

    <h3>Zinger Burger 🍔</h3>
    <p>Price: Rs. 450</p>

    <!-- Hum ne teen alag alag ids rakh lyein -->
    <button id="minusBtn">-</button>
    <span id="quantity">1</span>
    <button id="plusBtn">+</button>

    <script>
        // 1. Sab cheezon ko pakro
        let minus = document.getElementById("minusBtn");
        let plus = document.getElementById("plusBtn");
        let quantityDisplay = document.getElementById("quantity");

        // Ek variable banaya jis mein filhal quantity 1 save hai
        let count = 1;

        // 2. Plus Button ka pehredar
        plus.addEventListener("click", function() {
            count = count + 1; // quantity mein ek jama karo
            quantityDisplay.textContent = count; // screen par dikhao
        });

        // 3. Minus Button ka pehredar
        minus.addEventListener("click", function() {
            // Hum shart (if) lagayein gy ke quantity 1 sy niche na jaye
            if (count > 1) {
                count = count - 1; // quantity mein sy ek minus karo
                quantityDisplay.textContent = count; // screen par dikhao
            } else {
                alert("Kam sy kam 1 item toh order karna paray ga! 😉");
            }
        });
    </script>
</body>
</html>
