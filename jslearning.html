<!DOCTYPE html>
<html lang="en">
<head>
    <title>JS Learning</title>
</head>
<body>

    <h1>Apna Console Check Karo!</h1>

    <script>
        // Yeh aap ka pehla JS code hai
        let myName = "Alex";
        let status = "Beginner";
        
        console.log("Hello World!");
        console.log("Mera naam " + myName + " hai aur mein JS mein " + status + " hun.");
        let biscuits = 5;
        let pricePerBiscuit = 20;

        let totalBill = biscuits * pricePerBiscuit;
        console.log("Ap ka total bill hai: " + totalBill + " Rupees");
        let bankBalance = 3000; // Aap ke account mein sirf 3000 hain
        let withdrawAmount = 5000; // Aap nikalna chahte ho 5000

        // '<' ka matlab hai 'Less than' (kam hona)
        if (withdrawAmount <= bankBalance) {
            console.log("Paise nikal rahay hain... Transaction Successful! 🎉");
            } else {
                    console.log("Aray! Account mein itne paise nahi hain. Transaction Failed! ❌");
                    }
                    let marks = 75;

if (marks >= 80) {
    console.log("A Grade! Shabaash! 🌟");
} else if (marks >= 60) {
    console.log("B Grade! Bohat achay! 👍");
} else if (marks >= 40) {
    console.log("C Grade! Pass ho gaye. 🌟");
} else {
    console.log("Fail! Agli baar sahi. 📚");
}
let bikeMeinPetrolHai = true;
let jebMeinPaiseHain = true;

// '&&' check karta hai ke dono side true hain ya nahi
if (bikeMeinPetrolHai == true && jebMeinPaiseHain == true) {
    console.log("Chalo dosto ke sath ghoomne chalte hain! 🏍️");
} else {
    console.log("Ghar par betho sakoon sy.");
}
let biryaniMili = false;
let pulaoMila = true;

// '||' kehta hai koi ek bhi true ho jaye toh mein maan jaonga
if (biryaniMili == true || pulaoMila == true) {
    console.log("Khana tayyar hai, chalo khayein! 🍽️");
} else {
    console.log("Kuch nahi mila, bhookay so jao.");
}
// 1. Function Banano (Definition)
function sayHello() {
    console.log("Assalam-o-Alaikum!");
    console.log("Aap JavaScript seekh rahay hain.");
}

// 2. Button Dabana (Function Call)
sayHello();
// Hum ne 'naam' naam ka ek khali variable rakh diya andar
function khushAamdeed(naam) {
    console.log("Welcome " + naam + "! Kaise hain aap?");
}

// Ab chalate huay hum andar apna data bhein gy (Arguments)
khushAamdeed("Mahi");  // Output: Welcome Mahi! Kaise hain aap?
khushAamdeed("Ali");   // Output: Welcome Ali! Kaise hain aap?
// Ek hi array mein saare dosto ke naam!
let friends = ["Ali", "Sara", "Mahi", "Zain"];
console.log(friends[0]); // Output aaye ga: Ali
console.log(friends[2]); // Output aaye ga: Mahi
let myPhone = {
    brand: "Samsung",
    model: "S23",
    color: "Black",
    price: 150000
};
console.log(myPhone.brand); // Output: Samsung
console.log(myPhone.price); // Output: 150000
let shoppingCart = [
    { name: "Laptop", price: 80000 },
    { name: "Mouse", price: 1500 },
    { name: "Keyboard", price: 2500 }
];

// Agar mujhe pehli cheez (Laptop) ka naam chahiye:
console.log(shoppingCart[0].name); // Output: Laptop
// 1. Shuru karo 1 sy: let i = 1
// 2. Chalo 5 tak: i <= 5
// 3. Har baar ek qadam barhao: i++ (i++ ka matlab hota hai i mein +1 kar do)

for (let i = 1; i <= 5; i++) {
    console.log("Sorry " + i);
}
let friendss = ["Ali", "Sara", "Mahi", "Zain"];

// friends.length ka matlab hai array mein total kitne log hain (yani 4)
for (let i = 0; i < friendss.length; i++) {
    console.log("Assalam-o-Alaikum " + friendss[i]);
}

    </script>
</body>
</html>
