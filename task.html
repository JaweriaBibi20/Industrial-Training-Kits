<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenTask | Premium Productivity Board</title>
    <link rel="stylesheet" href="task-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-container">
        
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-logo">Z</div>
                <h2>ZenTask</h2>
            </div>
            <nav class="menu">
                <a href="#" class="menu-item active">✨ My Board</a>
                <a href="#" class="menu-item">📅 Weekly View</a>
                <a href="#" class="menu-item">🎨 Themes</a>
            </nav>
            <div class="user-profile">
                <div class="avatar">JB</div>
                <div class="user-details">
                    <h4>Jaweria Bibi</h4>
                    <p>Premium Member</p>
                </div>
            </div>
        </aside>

        <main class="workspace">
            
            <header class="header">
                <div class="welcome">
                    <h1>Aesthetic Workspace</h1>
                    <p>Focus on what matters today.</p>
                </div>
                <button class="add-btn">+ New Task</button>
            </header>

            <section class="stats-grid">
                <div class="stat-card lavender">
                    <div class="stat-info">
                        <span>Total Tasks</span>
                        <h3>08</h3>
                    </div>
                    <div class="stat-badge">Active</div>
                </div>
                <div class="stat-card peach">
                    <div class="stat-info">
                        <span>In Progress</span>
                        <h3>03</h3>
                    </div>
                    <div class="stat-badge">Today</div>
                </div>
                <div class="stat-card mint">
                    <div class="stat-info">
                        <span>Completed</span>
                        <h3>05</h3>
                    </div>
                    <div class="stat-badge">Success</div>
                </div>
            </section>

            <section class="board-section">
                <div class="board-header">
                    <h2>Daily Checklist</h2>
                    <span class="date">Thursday, July 16</span>
                </div>

                <div class="task-list">
                    
                    <label class="task-item">
                        <input type="checkbox" class="task-checkbox">
                        <span class="custom-check"></span>
                        <div class="task-details">
                            <p class="task-title">Design SQL Schema for Ticketing System</p>
                            <span class="tag tag-db">Database</span>
                        </div>
                    </label>

                    <label class="task-item">
                        <input type="checkbox" class="task-checkbox" checked>
                        <span class="custom-check"></span>
                        <div class="task-details">
                            <p class="task-title">Push Java Calendar Project to GitHub</p>
                            <span class="tag tag-java">Java Swing</span>
                        </div>
                    </label>

                    <label class="task-item">
                        <input type="checkbox" class="task-checkbox">
                        <span class="custom-check"></span>
                        <div class="task-details">
                            <p class="task-title">Learn CSS Transitions & Animation effects</p>
                            <span class="tag tag-web">Web Dev</span>
                        </div>
                    </label>

                    <label class="task-item">
                        <input type="checkbox" class="task-checkbox">
                        <span class="custom-check"></span>
                        <div class="task-details">
                            <p class="task-title">Debug COAL Register allocation logic</p>
                            <span class="tag tag-coal">Assembly</span>
                        </div>
                    </label>

                </div>
            </section>

        </main>
    </div>

</body>
</html>
